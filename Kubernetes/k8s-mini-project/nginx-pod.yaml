apiVersion: v1
kind: Pod

metadata:
  name: nginx-pod
  namespace: mini-project

spec:
  containers:
    - name: nginx-container
      image: nginx
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
      ports:
        - containerPort: 80